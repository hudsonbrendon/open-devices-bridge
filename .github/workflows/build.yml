name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Select latest stable Xcode (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS deps
        run: npm ci || npm install

      - name: Stage providers + build frontend (needed by tauri-build/generate_context)
        run: bash scripts/build-providers.sh && npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app + .dmg
        run: npm run tauri build

      - name: Locate .dmg
        id: dmg
        run: echo "path=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Devices-Bridge-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Attach .dmg to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.path }}
